name: Changes report

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          pip-install: "pyyaml"

      - name: Generate changes JSON
        run: |
          bash scripts/get_changes.sh > changes.json
        shell: bash
        env:
          SKIP_FETCH: true

      - name: Check whether changes exist
        id: changes
        run: |
          if [ "$(cat changes.json)" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes detected, skipping HTML generation and artifact uploads"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Changes detected, proceeding with HTML generation and artifact uploads"
          fi
        shell: bash

      - name: Generate changes HTML
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python scripts/generate_changes_html.py --output changes.html changes.json
        shell: bash

      - name: Upload changes JSON
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: changes-json
          path: changes.json
          retention-days: 1
          archive: false

      - name: Upload changes HTML
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: changes-html
          path: changes.html
          retention-days: 1
          archive: false
