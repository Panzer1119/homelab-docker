---
services:
  dockerstats:
    image: drakonis96/dockerstats:v0.9.20@sha256:3f9f4e2200e013b52241b9a0a0cd0e8cfe51179d505412f4a7bba86f0793405d
    container_name: docker-stats
    hostname: docker-stats
    env_file: dockerstats.env
    # For hosts with an NVIDIA GPU and the NVIDIA Container Toolkit, you can uncomment the deploy/resources/devices section.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./users.db:/app/users.db
    ports:
      - "5431:5000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    container_name: cadvisor
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run:/var/run:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    #ports:
    #  - "8080:8080" # You can change the external port if you wish
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
...
