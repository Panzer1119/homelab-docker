---
name: apprise

services:
  apprise:
    image: caronc/apprise:2.0@sha256:6ae97e24b3447f85f725a03ba73c6dc3a5f4b99f4273ac126de2d9b5ed6205d5
    container_name: apprise
    hostname: apprise
    environment:
      - TZ=Europe/Berlin
      - PGID=1000
      - PUID=1000
      - APPRISE_DEFAULT_THEME=dark
      - APPRISE_STATEFUL_MODE=simple
      - APPRISE_CONFIG_LOCK=yes
      - APPRISE_WORKER_COUNT=4
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - /docker/config/apprise:/config
      - "${PWD}/config/pushover.yml:/config/pushover.yml:ro"
    ports:
      - "8116:8000"
    network_mode: bridge
    restart: always
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
