---
services:
  mc_atm10:
    image: itzg/minecraft-server:stable-java25-jdk
    tty: true
    stdin_open: true
    container_name: mc-atm10
    hostname: mc-atm10
    env_file:
      - mc.env
      - mc_atm10.env
    volumes:
      - "./config:/config:ro"
      - "/docker/data/minecraft/atm10:/data"
    network_mode: bridge
    ports:
      - "25565:25565"
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      retries: 20
    stop_grace_period: 1m
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
...
