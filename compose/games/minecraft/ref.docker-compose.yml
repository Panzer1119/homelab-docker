---
services:
  router:
    image: itzg/mc-router:1.44.0
    container_name: mc-router
    hostname: mc-router
    depends_on:
      - server_atm10
    environment:
      TZ: "Europe/Berlin"
      IN_DOCKER: "true"
      METRICS_BACKEND: "prometheus"
      RECORD_LOGINS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "25565:25565"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

  server_atm10:
    image: itzg/minecraft-server:stable-java25-jdk
    tty: true
    stdin_open: true
    container_name: mc-server-atm10
    hostname: mc-server-atm10
    env_file:
      - defaults/server.env
      - server_atm10.env
    volumes:
      - "./defaults:/defaults:ro"
      - "./downloads:/downloads:ro"
      - "/docker/data/minecraft/atm10:/data"
    labels:
      - "mc-router.host=op://Docker/Minecraft/ATM10/MC-Router-Host"
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      retries: 20
    stop_grace_period: 1m
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

  backup_borg_atm10:
    image: ghcr.io/panzer1119/mc-backup:2026.7.16
    container_name: mc-backup-borg-atm10
    hostname: mc-backup-borg-atm10
    depends_on:
      server_atm10:
        condition: service_healthy
    env_file:
      - defaults/backup_borg.env
      - backup_borg_atm10.env
    #command: now
    #entrypoint: bash
    volumes:
      - "/docker/data/minecraft/atm10:/data:ro"
      - "/docker/data/minecraft/atm10-backup-borg:/borg"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
...
