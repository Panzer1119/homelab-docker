---
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
    container_name: hoarder
    hostname: hoarder
    env_file:
      - hoarder.env
    volumes:
      - /docker/data/hoarder-app/data:/data
      - assets:/assets
    labels:
      - "de.panzer1119.docker.volume.default.cifs.host=op://Docker/Hoarder/CIFS/Host"
      - "de.panzer1119.docker.volume.default.cifs.username=op://Docker/Hoarder/CIFS/Username"
      - "de.panzer1119.docker.volume.default.cifs.password=op://Docker/Hoarder/CIFS/Password"
      - "de.panzer1119.docker.volume.hoarder_assets.cifs.share=op://Docker/Hoarder/CIFS/Share_Hoarder_Assets"
    ports:
      - "3038:3000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:156.0.8078.47-r1@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    dns:
      - 10.44.20.4
      - 10.44.20.72
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

  meilisearch:
    image: getmeili/meilisearch:v1.56@sha256:b7ba431bf6f9b26cc86132798f3640964147a699cf23f026b74c6c05dbb1d60d
    env_file:
      - meilisearch.env
    volumes:
      - /docker/data/hoarder-app/mailisearch:/meili_data
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

volumes:
  assets:
    name: hoarder_assets
    # Because this is a cifs volume, and it needs credentials, it is created outside of this file
    external: true
...
