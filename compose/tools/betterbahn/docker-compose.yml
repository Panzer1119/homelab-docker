---
services:
  betterbahn:
    image: ghcr.io/betterbahn/betterbahn:latest@sha256:7081382771d19a6a05bfecb614a26957bc2707cfdca05215c3fd5b09211c6c30
    container_name: betterbahn
    hostname: betterbahn
    environment:
      - TZ=Europe/Berlin
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    network_mode: bridge
    ports:
      - "8645:3000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
