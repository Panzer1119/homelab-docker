---
services:
  betterbahn:
    image: ghcr.io/betterbahn/betterbahn:latest@sha256:0cdded66e3cd7ff973ba09fa6ff36ec18c84e2933c2b45160a8372d4f2015fe4
    container_name: betterbahn
    hostname: betterbahn
    environment:
      - TZ=Europe/Berlin
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    network_mode: bridge
    ports:
      - "8645:3000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
