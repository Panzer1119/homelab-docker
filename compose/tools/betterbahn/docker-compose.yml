---
services:
  betterbahn:
    image: ghcr.io/betterbahn/betterbahn:latest@sha256:4345ec4a0a8136e11eab820569ffe19b32f0bd57c85ea3dcdbe5bcc8d03e9159
    container_name: betterbahn
    hostname: betterbahn
    environment:
      - TZ=Europe/Berlin
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    network_mode: bridge
    ports:
      - "8645:3000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
