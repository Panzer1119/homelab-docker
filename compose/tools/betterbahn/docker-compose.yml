---
services:
  betterbahn:
    image: ghcr.io/betterbahn/betterbahn:latest@sha256:eb7eab6eb3e4a63d4ec22f68e21a15cc3553089c5e7e132860ce1adb6289d447
    container_name: betterbahn
    hostname: betterbahn
    environment:
      - TZ=Europe/Berlin
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    network_mode: bridge
    ports:
      - "8645:3000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
