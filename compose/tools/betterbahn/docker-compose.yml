---
services:
  betterbahn:
    image: ghcr.io/betterbahn/betterbahn:latest@sha256:ef5ed95c9013b33e2cecc5cdede86fcded0caaf42cbeb19696878009f9939159
    container_name: betterbahn
    hostname: betterbahn
    environment:
      - TZ=Europe/Berlin
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    network_mode: bridge
    ports:
      - "8645:3000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
