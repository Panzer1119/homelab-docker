---
services:
  betterbahn:
    image: ghcr.io/betterbahn/betterbahn:latest@sha256:6d7cf2772119cef17fa60b734b57a746523395befe96075ec5069ff7bb11b551
    container_name: betterbahn
    hostname: betterbahn
    environment:
      - TZ=Europe/Berlin
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    network_mode: bridge
    ports:
      - "8645:3000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
