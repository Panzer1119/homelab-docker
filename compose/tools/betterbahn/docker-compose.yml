---
services:
  betterbahn:
    image: ghcr.io/betterbahn/betterbahn:latest@sha256:e8e9c5433114e203ab4dc092190d58a6c41959e3efb5ebe8abd450e633394784
    container_name: betterbahn
    hostname: betterbahn
    environment:
      - TZ=Europe/Berlin
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    network_mode: bridge
    ports:
      - "8645:3000"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf
