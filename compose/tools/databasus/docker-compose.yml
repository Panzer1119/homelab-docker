---
services:
  databasus:
    image: databasus/databasus:v3.63.3@sha256:a00e5ed3b8ba5ef4b15457f07112c2a6d780fa8bc39bae633c8608ea7fa7d30f
    container_name: databasus
    hostname: databasus
    volumes:
      - /docker/data/databasus:/databasus-data
    networks:
      - default
      - backup-net
    ports:
      - "4005:4005"
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/4005 && printf 'GET /api/v1/system/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

networks:
  backup-net:
    name: backup-net
    external: true
...
