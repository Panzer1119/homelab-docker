---
services:
  databasus:
    image: databasus/databasus:v3.42.0@sha256:f748c20cecb3cf3162d80ebfddd4f192b5e4ee640d600c9daf726310ac49e51c
    container_name: databasus
    hostname: databasus
    volumes:
      - /docker/data/databasus:/databasus-data
    networks:
      - default
      - backup-net
    ports:
      - "4005:4005"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4005/api/v1/system/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

networks:
  backup-net:
    name: backup-net
    external: true
...
