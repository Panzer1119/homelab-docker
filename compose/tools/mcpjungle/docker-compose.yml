---
# MCPJungle Docker Compose configuration for individual users.
# Use this compose file if you want to run MCPJungle locally for your personal MCP management & Gateway.
# The mcpjungle server runs in development mode.
services:
  db:
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    container_name: mcpjungle-db
    env_file: db.env
    volumes:
      - /docker/data/mcpjungle:/var/lib/postgresql/data
    networks:
      - default
      - backup-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -U $$POSTGRES_USER -d $$POSTGRES_DB"] ## $$ because of docker-compose
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

  mcpjungle:
    image: ghcr.io/mcpjungle/mcpjungle:0.4.5-stdio@sha256:31253649f23132eda461dd100cd3e09ab4420a618d5c359e420aab79cc55e0c7
    container_name: mcpjungle-server
    depends_on:
      db:
        condition: service_healthy
    env_file: mcpjungle.env
    volumes:
      # Mount host filesystem current directory to enable filesystem MCP server access
      #- .:/host:ro
      #FIXME PWD is not compatible with Git Worktrees when updating the docker containers
      - "${PWD}:/host:ro" #FIXME "PWD" might not work in all environments
      # Other options:
      # - ${HOME}:/host/home:ro
      # - /tmp:/host/tmp:rw
    ports:
      - "38233:8080"
    restart: unless-stopped
    extends:
      file: ../../common/docker-compose.yml
      service: logging-gelf

networks:
  backup-net:
    name: backup-net
    external: true
...
